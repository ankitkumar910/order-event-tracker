spring.application.name=order-event-tracker
spring.datasource.url=jdbc:mysql://localhost:3306/eventtrackerapp
spring.datasource.username=root
spring.datasource.password=ankit@123
spring.jpa.hibernate.ddl-auto=create

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# default type does: kafka listeners try to deserialize to the default type(class)
spring.kafka.consumer.properties.spring.json.value.default.type=dev.ankitkumar.ordereventtracker.dto.OrderEvent
# trusted package: this allows jackson to deserialize, by default, java.util is trusted
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.ankitkumar.ordereventtracker.dto
